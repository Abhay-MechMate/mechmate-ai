<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MechMate AI</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header class="navbar">
        <a class="brand" href="/" aria-label="MechMate AI home">
            <span class="brand-mark">MM</span>
            <span class="brand-copy"><span class="brand-name">MechMate AI</span><span class="brand-subtitle">Diagnostic dashboard</span></span>
        </a>
        <nav aria-label="Primary navigation">
            <span class="nav-links">
                <a class="{% if request.url.path == '/' %}active{% endif %}" href="/">Overview</a>
                <a class="{% if request.url.path.startswith('/vehicles') %}active{% endif %}" href="/vehicles">Vehicles</a>
                <a class="{% if request.url.path.startswith('/diagnose') %}active{% endif %}" href="/diagnose">Diagnose</a>
                <a class="{% if request.url.path.startswith('/history') %}active{% endif %}" href="/history">History</a>
                <a class="{% if request.url.path.startswith('/cases') %}active{% endif %}" href="/cases">Customer Cases</a>
                <a class="{% if request.url.path.startswith('/knowledge-base') %}active{% endif %}" href="/knowledge-base">Knowledge base</a>
                <a class="{% if request.url.path.startswith('/store-comparison') %}active{% endif %}" href="/store-comparison">Store Comparison</a>
            </span>
            <span class="nav-account">
                {% if current_user %}
                    <span class="nav-user" title="{{ current_user.email }}">{{ current_user.email }}</span>
                    <a href="/logout">Logout</a>
                {% else %}
                    <a class="{% if request.url.path == '/login' %}active{% endif %}" href="/login">Login</a>
                    <a class="nav-signup {% if request.url.path == '/signup' %}active{% endif %}" href="/signup">Sign up</a>
                {% endif %}
            </span>
        </nav>
    </header>
    <main class="container">{% block content %}{% endblock %}</main>
    <footer><p>MechMate AI - Automotive diagnostic internship prototype</p></footer>
    <script src="/static/vehicle_dropdowns.js"></script>
</body>
</html>
