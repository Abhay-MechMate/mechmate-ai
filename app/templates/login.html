{% extends "base.html" %}

{% block content %}
<section class="auth-shell">
    <div class="auth-intro">
        <p class="page-kicker">Local account</p>
        <h1>Welcome back.</h1>
        <p class="subtext">Log in to continue using your MechMate AI diagnostic workspace.</p>
    </div>
    <section class="card auth-card">
        <p class="section-label">Sign in</p>
        <h2>Log in</h2>
        {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
        <form method="post" action="/login" class="auth-form">
            <div><label for="email">Email address</label><input type="email" name="email" id="email" value="{{ email or '' }}" autocomplete="email" required></div>
            <div><label for="password">Password</label><input type="password" name="password" id="password" autocomplete="current-password" required></div>
            <button class="button" type="submit">Log in</button>
        </form>
        <p class="auth-switch">New to MechMate AI? <a href="/signup">Create an account</a>.</p>
    </section>
</section>
{% endblock %}
